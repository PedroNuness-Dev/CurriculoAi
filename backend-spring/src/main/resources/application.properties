spring.config.import=optional:file:./.env[.properties]

api.security.token.secret=${TOKEN_SECRET}
api.security.token.issuer=${TOKEN_ISSUE}

cerebras.api.key=${CEREBRAS_API_KEY}
cerebras.api.url=https://api.cerebras.ai/v1/chat/completions
cerebras.model=${CEREBRAS_MODEL:gpt-oss-120b}
spring.cloud.openfeign.client.config.cerebras.connect-timeout=5000
spring.cloud.openfeign.client.config.cerebras.read-timeout=60000
spring.cloud.openfeign.client.config.github.connect-timeout=5000
spring.cloud.openfeign.client.config.github.read-timeout=10000
spring.cloud.openfeign.client.config.github.default-request-headers.Accept=application/vnd.github+json
spring.cloud.openfeign.client.config.github.default-request-headers.User-Agent=CurriculoAi

spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# OpenAPI / Swagger
# Não replica as respostas do @RestControllerAdvice em todos os endpoints: cada controller documenta as suas
springdoc.override-with-generic-response=false
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true

app.cors.allowed-origins=${ALLOWED_ORIGINS}
